# 1. Change Java port to 9090 so it doesn't fight with XAMPP's Apache
server.port=9090

# 2. MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/nexuspos_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. OOP Magic: Tell Spring Boot to automatically create your SQL tables based on your Java Classes!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true