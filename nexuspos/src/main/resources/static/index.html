<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPOS | Professional Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --dark: #2b2d42;
            --light: #f8f9fa;
            --gray: #8d99ae;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.05);
            --hover-shadow: 0 15px 25px rgba(67, 97, 238, 0.15);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 30px; 
            background-color: #edf2f4; 
            color: var(--dark);
        }

        h2 { color: var(--dark); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 25px; }

        .main-container { display: flex; gap: 30px; }
        .inventory-section { width: 65%; }
        
        /* Floating Cart Panel */
        .cart-section { 
            width: 35%; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: var(--card-shadow); 
            height: fit-content;
            position: sticky;
            top: 30px;
        }

        /* Product Grid & Card Animations */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
        }

        .product-card { 
            background: white; 
            border: 1px solid #eef0f2; 
            padding: 20px; 
            border-radius: 16px; 
            text-align: center; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: var(--hover-shadow); 
            border-color: var(--primary);
        }

        .product-card h4 { margin: 0 0 10px 0; font-size: 1.1em; color: var(--dark); }
        .stock-badge { background: #eef0f2; color: var(--gray); font-size: 0.8em; padding: 4px 8px; border-radius: 20px; }
        .price { color: var(--primary); font-weight: 800; font-size: 1.4em; margin: 15px 0; }

        /* Interactive Buttons */
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 10px; 
            font-weight: 600;
            font-size: 1em;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }

        button:hover { background: #3f37c9; transform: scale(1.02); }
        button:active { transform: scale(0.98); }

        .checkout-btn { 
            background: var(--success); 
            font-size: 1.3em; 
            padding: 15px; 
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .checkout-btn:hover { background: #27ae60; }

        /* Cart & History Styles */
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #eef0f2; }
        .cart-item-name { font-weight: 600; }
        .cart-item-price { color: var(--gray); font-weight: 600; }
        
        hr { border: none; height: 2px; background: #eef0f2; margin: 20px 0; }
        
        .history-section { margin-top: 50px; background: white; padding: 30px; border-radius: 16px; box-shadow: var(--card-shadow); }
        .receipt-card { 
            border: 1px solid #eef0f2; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            background: #fafbfa;
            border-left: 5px solid var(--primary);
            animation: fadeIn 0.5s ease-out;
        }
        .receipt-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 15px; border-bottom: 2px solid #eef0f2; padding-bottom: 10px; color: var(--dark); }

        /* Keyframe Animations */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Staggered animation delays for product cards */
        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.15s; }
        .product-card:nth-child(3) { animation-delay: 0.2s; }
        .product-card:nth-child(4) { animation-delay: 0.25s; }
        .product-card:nth-child(5) { animation-delay: 0.3s; }
        .product-card:nth-child(6) { animation-delay: 0.35s; }
        .product-card:nth-child(7) { animation-delay: 0.4s; }
        .product-card:nth-child(8) { animation-delay: 0.45s; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="inventory-section">
            <h2>📦 Product Inventory</h2>
            <div id="product-grid" class="product-grid">
                <p>Loading products...</p>
            </div>
        </div>

        <div class="cart-section">
            <h2>🛒 Current Order</h2>
            <div id="cart-items">
                <p style="color: var(--gray); text-align: center;">Scan items to begin</p>
            </div>
            <hr>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: var(--gray);">Grand Total</h3>
                <h2 style="margin: 0; color: var(--dark); font-size: 2em;">$<span id="cart-total">0.00</span></h2>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout & Pay</button>
        </div>
    </div>

    <div class="history-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>🧾 Transaction Ledger</h2>
            <button onclick="loadHistory()" style="width: auto; padding: 10px 25px; background: #eef0f2; color: var(--dark);">↻ Refresh</button>
        </div>
        <div id="history-container">
            <p style="color: var(--gray);">No transactions yet. Complete an order to generate receipts.</p>
        </div>
    </div>

    <script>
        function loadProducts() {
            fetch('/api/products')
                .then(response => response.json())
                .then(products => {
                    const productGrid = document.getElementById('product-grid');
                    productGrid.innerHTML = ''; 
                    
                    products.forEach(product => {
                        productGrid.innerHTML += `
                            <div class="product-card">
                                <h4>${product.name}</h4>
                                <span class="stock-badge">ID: ${product.id} | Stock: ${product.stockQuantity}</span>
                                <div class="price">$${product.price.toFixed(2)}</div>
                                <button onclick="addToCart('${product.id}')">+ Add to Order</button>
                            </div>
                        `;
                    });
                });
        }

        function addToCart(productId) {
            fetch(`/api/cart/add/${productId}`, { method: 'POST' })
                .then(response => response.json())
                .then(updatedCart => refreshCartUI(updatedCart))
                .catch(error => console.error('Error adding to cart:', error));
        }

        function refreshCartUI(cart) {
            const cartContainer = document.getElementById('cart-items');
            const totalDisplay = document.getElementById('cart-total');
            
            cartContainer.innerHTML = ''; 
            
            if (!cart.items || cart.items.length === 0) {
                cartContainer.innerHTML = '<p style="color: var(--gray); text-align: center;">Scan items to begin</p>';
                totalDisplay.innerText = '0.00';
                return;
            }

            cart.items.forEach(item => {
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <span class="cart-item-name">${item.product.name}</span>
                            <span style="color: var(--primary); font-weight: bold; margin-left: 10px;">x${item.quantity}</span>
                        </div>
                        <span class="cart-item-price">$${item.subtotal.toFixed(2)}</span>
                    </div>
                `;
            });

            totalDisplay.innerText = cart.cartTotal.toFixed(2);
        }

        function checkout() {
            fetch('/api/cart/checkout', { method: 'POST' })
                .then(response => response.text())
                .then(message => {
                    alert("✅ " + message);
                    fetch('/api/cart').then(res => res.json()).then(cart => refreshCartUI(cart));
                    loadProducts(); 
                    loadHistory(); 
                })
                .catch(error => console.error('Error during checkout:', error));
        }

        function loadHistory() {
            fetch('/api/transactions')
                .then(response => response.json())
                .then(transactions => {
                    const historyContainer = document.getElementById('history-container');
                    
                    if (transactions.length === 0) {
                        historyContainer.innerHTML = '<p style="color: var(--gray);">No transactions yet.</p>';
                        return;
                    }

                    historyContainer.innerHTML = '';
                    
                    transactions.slice().reverse().forEach(tx => {
                        let itemsHtml = '';
                        tx.purchasedItems.forEach(item => {
                            itemsHtml += `
                                <div class="cart-item" style="border: none; padding: 5px 0;">
                                    <span>${item.product.name} <span style="color: var(--gray);">x${item.quantity}</span></span>
                                    <span style="font-weight: 600;">$${(item.product.price * item.quantity).toFixed(2)}</span>
                                </div>
                            `;
                        });

                        const date = new Date(tx.timestamp).toLocaleString();

                        historyContainer.innerHTML += `
                            <div class="receipt-card">
                                <div class="receipt-header">
                                    <span>Receipt ID: ${tx.transactionId}</span>
                                    <span>${date}</span>
                                </div>
                                ${itemsHtml}
                                <div style="text-align: right; margin-top: 15px; font-weight: 800; font-size: 1.2em; color: var(--success);">
                                    Total Paid: $${tx.grandTotal.toFixed(2)}
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(error => console.error('Error fetching history:', error));
        }

        loadProducts();
        fetch('/api/cart').then(response => response.json()).then(cart => refreshCartUI(cart));
        loadHistory();
    </script>
</body>
</html>
